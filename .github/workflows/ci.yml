# CI（docs/gaps.md §7）：此前四个构建变体 + 全部 ctest 套件全靠人工本地跑。
# 变体矩阵与 build.sh 对齐：主构建 / TSan / meta 引擎（sqlite+redis 同编译）。
# seastar/tikv/rados 变体依赖重型系统工具链或外部集群，留在本地按需验证
# （对应 e2e 在无依赖时本就 SKIP）。
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            args: ""
          - name: tsan
            args: "--tsan"
          - name: meta-engines
            args: "--sqlite --redis"
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
        # 子模块由 build.sh 自行按需 init（rocksdb 是 shallow 克隆，
        # checkout 全递归会把 seastar/client-c 也拉下来，白费十几分钟）

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build ccache libboost-dev libssl-dev curl
          # redis 变体的单测/e2e 需要本地 redis-server，缺失时用例只会 SKIP
          if [[ "${{ matrix.name }}" == "meta-engines" ]]; then
            sudo apt-get install -y --no-install-recommends redis-server
            sudo systemctl stop redis-server || true   # 测试自起私有实例，避免端口冲突
          fi

      # rocksdb 子模块单次冷编译 ~15 分钟；ccache 让增量 PR 降到分钟级
      - name: Set up ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.name }}-${{ hashFiles('CMakeLists.txt', '.gitmodules') }}
          restore-keys: ccache-${{ matrix.name }}-

      - name: Build and test
        run: |
          ccache --max-size=2G
          ./build.sh ${{ matrix.args }} --test \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: ccache stats
        if: always()
        run: ccache -s
