# LightS3 sample config (docs/architecture.md §5)
# What takes effect by default is the uncommented localfs entry under backends at the
# bottom; every other backend is given as commented-out full parameter sets (values are
# the defaults, except those marked "required") — uncomment to switch.
# Note: the built-in YAML parser is simplified (no tab indentation/flow style/anchors, src/core/config.cc).
# Size units: B/KiB/MiB/GiB (KB/MB/GB/K/M/G are synonyms); duration units: s/m/h/d.
http:
  driver: builtin          # builtin | beast | httplib (must be compiled in via the matching CMake option)
  bind: 0.0.0.0
  port: 9000
  io_threads: 4            # beast=IO thread count / httplib=thread pool / seastar=shard count;
                           # builtin (thread-per-connection) ignores it and WARNs when set explicitly
  max_header_size: 16KiB
  idle_timeout: 60s
  # Minimum size for non-final multipart parts (AWS fixes it at 5MiB). 0 = no limit —
  # relax it when fronted by toolchains that don't honor this rule, or when this
  # instance is merely a proxy for another lights3
  min_part_size: 5MiB
  # ---------- TLS (docs/archive/gaps.md §7) ----------
  # HTTPS is enabled only when both are given; only the httplib/beast drivers support
  # it, builtin/seastar error out at startup if configured (never silently run
  # plaintext). SigV4 UNSIGNED-PAYLOAD integrity relies on transport-layer encryption;
  # strongly recommended for public deployments (or terminate TLS at a fronting LB)
  # tls_cert: /etc/lights3/server.crt   # PEM certificate chain
  # tls_key: /etc/lights3/server.key    # PEM private key
  # ---------- Shutdown/backpressure boundaries (docs/archive/gaps.md §7, values are defaults) ----------
  # drain_limit: 4MiB          # max request body drained before erroring (beyond it, close the connection)
  # trailer_max_size: 16KiB    # chunked trailer section cap (builtin/seastar hand-written parsers)
  # io_chunk_size: 64KiB       # streaming read/write block size
  # body_queue_cap: 256KiB     # push-to-pull queue capacity, i.e. backpressure watermark (httplib only)
  # shutdown_grace: 10s        # grace period waiting for in-flight requests on shutdown
  # shutdown_force_wait: 5s    # second wait after forced disconnect

runtime:
  io_threads: 16           # blocking IO thread pool size
  max_inflight_requests: 1024

auth:
  credentials:
    - access_key: AKIDEXAMPLE
      secret_key: ${LIGHTS3_SECRET_1}   # env var reference; if empty, all requests are rejected
  region: us-east-1
  # ---------- Credential management phase 2 (docs/credential-management.md §10) ----------
  # At-rest encryption of dynamic credential SKs is not configured here: set the env var
  # LIGHTS3_MASTER_KEY (64 hex chars, e.g. `openssl rand -hex 32`) to enable it;
  # existing plaintext objects are upgraded automatically at startup.
  # credentials_file: /etc/lights3/creds.json  # external credentials file (hot reload, data plane only).
  #                                            # Format: {"credentials": [{"access_key",
  #                                            # "secret_key", "comment"?, "policy"?}]}
  # credentials_file_reload: 30s               # file mtime polling period; 0s = load at startup only
  # sync_interval: 0s                          # with a shared multi-instance backend, periodic incremental
  #                                            # reload of .sys (pick up additions/revocations); 0s = off (single-instance default)

# ---------- Static website hosting (docs/static-website.md) ----------
# Buckets listed here accept anonymous GET/HEAD object reads (no listing, no
# subresources, response-* overrides refused). Exact names only, no globs.
# Entries here are static: immutable via the API and they win over same-name
# dynamic ones. Buckets can also be enabled at runtime via the root-only
# ?website API (`s3adm website set <bucket>`), persisted to .sys/website/ and
# hot-synced across instances via auth.sync_interval.
# website:
#   - bucket: my-site
#     index_suffix: index.html   # appended when the key is empty or ends with '/'; no '/' allowed
#     error_key: error.html      # served as anonymous 4xx/5xx body (original status kept);
#                                # omit for a built-in minimal HTML error page
#     max_rps: 0                 # anonymous requests/second for this bucket (token bucket,
#                                # burst = rps); 0 = unlimited (roadmap §2.3)
#     redirect_all_host: ""      # non-empty: every anonymous request 301s to this host
#     redirect_all_protocol: ""  # http|https; empty = follow the request scheme
#   RoutingRules and CORS/lifecycle rules are managed via the ?website / ?cors /
#   ?lifecycle APIs (root only) and persisted under .sys/.

# ---------- Lifecycle enforcement (roadmap §2.4) ----------
# How often the runner walks buckets with ?lifecycle rules, expiring objects
# (Expiration.Days) and aborting stale multipart uploads
# (AbortIncompleteMultipartUpload.DaysAfterInitiation).
# lifecycle:
#   scan_interval: 1h            # 0s = enforcement off (the API still stores rules)

# ---------- Usage accounting / quotas (roadmap §3.9, docs/multi-tenancy.md §2/§7) ----------
# Per-bucket object/byte counters kept by the gateway (updated on every write,
# persisted to .sys/usage/, recounted by a periodic full listing). Bucket quotas
# (?quota / s3adm quota) and tenant quotas (s3adm tenant) are enforced on them.
# usage:
#   enabled: true               # false = no counters and no quota enforcement (skips the pre-write HEAD)
#   flush_interval: 60s         # persist dirty counters; 0s = only at shutdown / after a scan
#   reconcile_interval: 1d      # full recount of every bucket; 0s = on demand only (s3adm usage --rescan)
#   reconcile: true             # multi-gateway: true on ONE instance only (bootstrap + periodic recounts)

# ---------- Audit log (roadmap §3.9 ④, docs/multi-tenancy.md §5) ----------
# JSON lines in a dedicated rotating file: credential/tenant/quota lifecycle,
# STS sessions, bucket create/delete, quota rejections; data_plane adds one
# record per S3 request. Empty path = off.
# audit:
#   path: /var/log/lights3/audit.log
#   data_plane: false           # requires path
#   max_size: 64MiB             # rotation threshold
#   max_files: 10               # rotated files kept

backends:
  # ---------- localfs / xlocalfs: local filesystem (docs/storage-backend.md) ----------
  - name: localdata
    type: localfs                      # localfs | xlocalfs (io_uring data plane) | memory
    root: ./data/objects
    staging: ./data/staging            # must be on the same filesystem as root (rename atomicity);
                                       # default <root>/.lights3-staging
    # queue_depth: 256                 # xlocalfs only: io_uring SQ depth
    # -- roadmap §3.5 (docs/storage/localfs.md §2/§3/§6/§12; values are defaults) --
    # require_xattr: false             # true = refuse to start (and to write) on a filesystem without user xattrs
    # sidecar: sync                    # sync | async (sidecar written after the response) | lazy (none while the xattr succeeds)
    # list_meta_concurrency: 8         # pool workers sharing one listing page's stat+getxattr
    # list_cache_entries: 1M           # per-directory sorted-entry cache budget (entries; 0 = off)
    # list_cache_min_dir_entries: 256  # directories smaller than this are never cached
    # sidecar_scan_interval: 1d        # orphan-sidecar sweep period; 0s = off
    # -- roadmap §3.8 object metadata cache (docs/storage/localfs.md §5.1) --
    # meta_cache_entries: 64K          # cached object records (0 = off); a hit spares the xattr/sidecar read
    # meta_cache_ttl: 0s               # entry expiry; 0s = never (write paths invalidate exactly)
    # meta_cache_validate: true        # HEAD re-checks the inode stamp with one stat; false = trust until invalidated/expired

  # ---------- duostore: metadata KV + chunk/pack data engine (docs/duostore-backend.md) ----------
  # meta engine, pick one of four: rocksdb (default) | redis | sqlite | tikv;
  # data engine, pick one of two: fs (default) | rados.
  # redis/sqlite/tikv/rados must be compiled in via the matching CMake options
  # (LIGHTS3_DUOSTORE_*, build.sh's --redis/--sqlite/--rados/--tikv). Keys specific to
  # a non-selected engine are ignored with a WARN.
  # - name: duodata
  #   type: duostore
  #   root: ./data/duostore            # required; meta/ chunks/ packs/ all live under it
  #   verify_chunk_crc: false          # read-path chunk CRC verification (shared by both data engines)
  #   # -- Background GC and orphan scan (all effective; docs/duostore-backend.md §9) --
  #   gc_interval: 300s                # reclaim period; 0s = disable background GC
  #   gc_enabled: true                 # false = non-designated instance in a multi-gateway setup (§8.3 single instance runs GC)
  #   gc_grace: 300s                   # delayed-deletion grace (defense in depth against concurrent reads)
  #   orphan_scan_interval: 1d
  #   # -- roadmap §3.8 object metadata cache (docs/storage/duostore-core.md §7.1) --
  #   meta_cache_entries: 64K          # cached ObjectRec budget; default 64K on rocksdb/sqlite, 0 on redis/tikv
  #   meta_cache_ttl: 0s               # required (0 < ttl < gc_grace) when enabling the cache on redis/tikv
  #   mpu_ttl: 7d                      # cleanup deadline for incomplete multipart uploads; 0 = off
  #
  #   # -- meta = rocksdb (default, docs/duostore-backend.md) --
  #   meta: rocksdb
  #   meta_path: ./data/duostore/meta  # default <root>/meta (can point to an SSD separately)
  #   rocksdb_block_cache: 64MiB
  #   rocksdb_write_buffer: 64MiB      # per-CF memtable capacity (RocksDB default 64MiB)
  #   rocksdb_max_write_buffers: 2     # per-CF memtable count cap (>=1)
  #   rocksdb_max_background_jobs: 2   # total flush/compaction background threads (>=1)
  #   meta_sync: true                  # fsync WAL on every commit (shared by rocksdb/sqlite)
  #
  #   # -- meta = redis (docs/duostore-redis-meta.md §8) --
  #   # meta: redis
  #   # redis_uri: redis://127.0.0.1:6379  # required; unix:///path/redis.sock also supported
  #   # redis_prefix: "duo:"               # key prefix (multi-instance/test isolation)
  #   # redis_timeout: 3s                  # connect + per-command timeout
  #   # redis_pool_size: 8                 # connection pool size [1,256]
  #   # redis_wait_replicas: 0             # replicas to WAIT for after commit [0,256] (0=no wait;
  #                                        # with Sentinel primaries/replicas this narrows the failover lost-write window, insufficient replicas only WARN)
  #
  #   # -- meta = sqlite (docs/duostore-sqlite-meta.md §8) --
  #   # meta: sqlite
  #   # sqlite_path: ./data/duostore/meta.sqlite3   # default <root>/meta.sqlite3
  #   # sqlite_cache: 64MiB                # process-level page cache total budget (>= 1MiB)
  #   # meta_sync: true                    # maps to PRAGMA synchronous FULL/NORMAL
  #
  #   # -- meta = tikv (docs/duostore-tikv-meta.md §9) --
  #   # meta: tikv
  #   # pd_endpoints: "127.0.0.1:2379"     # required; comma-separated multiple PDs
  #   # tikv_prefix: "duo:"                # key prefix (multi-instance/test isolation)
  #   # tikv_ca: /path/ca.pem              # mTLS trio: all three or none
  #   # tikv_cert: /path/client.pem
  #   # tikv_key: /path/client-key.pem
  #   # tikv_gc_interval: 60s              # GC safepoint advance period (required for pure KV clusters;
  #                                        # set 0 to disable when sharing a TiDB cluster, §7.3)
  #   # tikv_gc_retention: 10m             # safepoint retention window (now − retention, must be positive)
  #   # tikv_backoff_ms: 0                 # sidecar-path backoff budget (0 = client-c library default)
  #
  #   # -- data = fs (default): chunk/pack local engine (docs/duostore-backend.md) --
  #   data: fs
  #   chunk_size: 8MiB
  #   pack_threshold: 128KiB           # objects <= this go into packs; 0 = off (everything via chunks)
  #   pack_max_size: 128MiB            # active pack sealing threshold (rotate to a new pack)
  #   pack_writers: 4                  # concurrent active packs (1-64)
  #   pack_gc_ratio: 0.5               # live ratio below this triggers compaction (effective in P4)
  #
  #   # -- data = rados (docs/duostore-rados-data.md §10) --
  #   # data: rados
  #   # rados_pool: lights3                # required
  #   # rados_conf: /etc/ceph/ceph.conf
  #   # rados_client: client.admin
  #   # rados_namespace: ""                # logical isolation within the pool (multi-instance/test)
  #   # rados_chunk_size: 8MiB             # [4KiB, 128MiB] (aligned with osd_max_object_size)
  #   # rados_buffer_total: 256MiB         # total write buffer (>= rados_chunk_size)
  #   # rados_connect_timeout: 5s
  #   # rados_op_timeout: 0s               # 0 = no op timeout

  # ---------- cloudproxy: forward to a remote S3 (docs/cloudproxy-backend.md) ----------
  # Requires LIGHTS3_CLOUDPROXY=ON (default on).
  # - name: cloudpx
  #   type: cloudproxy
  #   endpoint: https://s3.example.com   # required; scheme://host[:port]
  #   region: us-east-1
  #   access_key: ${REMOTE_AK}           # leave BOTH empty to use the AWS credential chain:
  #   secret_key: ${REMOTE_SK}           # env → container endpoint (ECS/EKS) → EC2 IMDSv2 (roadmap §3.3)
  #   imds_endpoint: http://169.254.169.254  # metadata base URL (override for tests/proxies)
  #   bucket_prefix: ""                  # remote bucket = prefix + local name
  #   force_path_style: true             # false = virtual-hosted style (supported, §7 deployment constraints)
  #   tls_verify: true
  #   ca_cert: ""                        # CA certificate path for self-signed remotes
  #   connect_timeout_ms: 5000
  #   request_timeout_ms: 60000
  #   retry_max: 3                       # [0,16]
  #   retry_base_ms: 100                 # exponential backoff base; a remote Retry-After (429/503) wins
  #   op_deadline_ms: 0                  # total budget for one op's retry loop; 0 = no cap
  #   breaker_threshold: 10              # consecutive transport/5xx failures that open the
  #                                      # circuit breaker (fail fast with 503); 0 = disabled
  #   breaker_cooldown_ms: 10000         # open duration before a single half-open probe
  #   max_connections: 16
  #   pool_idle_timeout_ms: 60000        # idle connections older than this are never reused
  #                                      # and get reaped (NAT-drop protection); 0 = keep forever
  #   pool_max_lifetime_ms: 0            # retire connections by age at release; 0 = unlimited
  #   verify_etag: true                  # compare single-part PUT MD5 against the remote ETag (§6)
  #   queue_cap: 1MiB                    # data-plane queue capacity (backpressure watermark) [4KiB,1GiB]
  #   control_in_pump: false             # true = small control-plane requests also go through the pump thread (§8.2)
  #   io_threads: 8                      # backend-dedicated thread pool (generic key, available to all backends;
  #                                      # default shares runtime.io_threads' pool)

  # ---------- tiered: local cache + cloud sink (docs/tiered-storage.md) ----------
  # local/cloud reference other backends in this list by name; local must be localfs/xlocalfs or duostore.
  # - name: tierdata
  #   type: tiered
  #   local: localdata                   # required
  #   cloud: cloudpx                     # required
  #   cold_after: 30d                    # coldness threshold
  #   scan_interval: 1h                  # 0s = disable background scan
  #   space_high_watermark: 85%          # triggers space reclaim
  #   space_low_watermark: 70%           # reclaim target
  #   min_free_bytes: 1GiB               # minimum headroom required for cache fill
  #   cache_fill_on_range: true          # on a Range hit in the cloud, refill the whole object in the background
  #   max_concurrent_transfers: 4
  #   quota_bytes: 0                     # logical quota; 0 = disabled
  #   gc_retry_base: 60s                 # exponential backoff base for failed cloud deletions (§9)
  #   gc_retry_cap: 1h                   # backoff cap
  #   reconcile_interval: 0s             # index/cloud reconciliation period; 0s = off (§9)
  #   reconcile_orphans: rebuild         # rebuild = recreate index entries | delete = remove cloud orphans
  #   # -- roadmap §3.6 (docs/tiered-storage.md §4.3/§5.1/§6.3/§9) --
  #   full_scan_interval: 1d             # full enumeration safety net; rounds in between consume the time wheel; 0s = every round full
  #   evict_size_weight: 0               # eviction score size weighting (log2 of MiB); 0 = ignore size
  #   evict_frequency_weight: 0          # eviction score access-count weighting; 0 = pure LRU
  #   access_buffer_max: 100000          # write-behind access-record buffer (keys) before an early flush
  #   range_cache: false                 # block-level partial cache for Range GETs of remote objects (localfs local only)
  #   range_cache_block: 1MiB            # [64KiB, 1GiB]
  #   rules:                             # per-prefix policy: "bucket/key" glob, first match wins
  #     - match: "archive-*/raw/*"
  #       cold_after: 7d
  #     - match: "archive-*/keep/*"
  #       cold_after: never              # pinned: never demoted, never evicted

buckets:
  default_backend: localdata
  rules: []                # glob-matched in declaration order (docs/storage-backend.md §2)
  # rules:
  #   - match: "archive-*"               # fnmatch glob
  #     backend: tierdata

log:
  level: info
