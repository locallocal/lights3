# compose profile `multi`: plain round-robin over the two gateways, no session
# stickiness — every request of a multipart upload may land on either instance
# (docs/storage/multi-gateway-multipart-design.md §1). No upstream keepalive, so the
# rotation is per request; bodies stream through unbuffered (S3 PUTs are large)
worker_processes auto;
events { worker_connections 1024; }
http {
    upstream lights3 {
        server lights3-multi-a:9000;
        server lights3-multi-b:9000;
    }
    server {
        listen 9000;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        location / {
            proxy_pass http://lights3;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;  # SigV4 signs the Host the client used
            proxy_set_header Connection "";
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
